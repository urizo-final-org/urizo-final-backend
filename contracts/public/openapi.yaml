      "AgentJobResponse": {
        "type": "object",
        "additionalProperties": false,
        "allOf": [
          {
            "if": {
              "properties": { "status": { "const": "QUEUED" } },
              "required": ["status"]
            },
            "then": {
              "properties": {
                "progress": {
                  "properties": { "percent": { "const": 0 } },
                  "required": ["percent"]
                }
              },
              "not": {
                "anyOf": [
                  { "required": ["startedAt"] },
                  { "required": ["finishedAt"] },
                  { "required": ["failure"] }
                ]
              }
            }
          },
          {
            "if": {
              "properties": { "status": { "enum": ["RUNNING", "WAITING_APPROVAL"] } },
              "required": ["status"]
            },
            "then": {
              "required": ["startedAt"],
              "not": {
                "anyOf": [
                  { "required": ["finishedAt"] },
                  { "required": ["failure"] }
                ]
              }
            }
          },
          {
            "if": {
              "properties": { "status": { "const": "SUCCEEDED" } },
              "required": ["status"]
            },
            "then": {
              "required": ["startedAt", "finishedAt"],
              "properties": {
                "progress": {
                  "properties": { "percent": { "const": 100 } },
                  "required": ["percent"]
                }
              },
              "not": { "required": ["failure"] }
            }
          },
          {
            "if": {
              "properties": { "status": { "const": "WAITING_APPROVAL" } },
              "required": ["status"]
            },
            "then": {
              "properties": {
                "progress": {
                  "properties": { "phase": { "const": "APPROVAL_PENDING" } },
                  "required": ["phase"]
                }
              }
            }
          },
          {
            "if": {
              "properties": { "status": { "const": "FAILED" } },
              "required": ["status"]
            },
            "then": { "required": ["finishedAt", "failure"] }
          },
          {
            "if": {
              "properties": { "status": { "const": "CANCELLED" } },
              "required": ["status"]
            },
            "then": {
              "required": ["finishedAt"],
              "not": { "required": ["failure"] }
            }
          }
        ],
        "required": ["schemaVersion", "traceId", "jobId", "projectId", "jobType", "status", "stateVersion", "progress", "createdAt", "updatedAt"],
        "properties": {
          "schemaVersion": { "$ref": "#/components/schemas/SchemaVersion" },
          "traceId": { "$ref": "#/components/schemas/Uuid" },
          "jobId": { "$ref": "#/components/schemas/Uuid" },
          "projectId": { "$ref": "#/components/schemas/Uuid" },
          "jobType": { "$ref": "#/components/schemas/JobType" },
          "status": { "$ref": "#/components/schemas/JobStatus" },
          "stateVersion": { "type": "integer", "minimum": 1 },
          "progress": { "$ref": "#/components/schemas/JobProgress" },
          "resourceRefs": {
            "type": "array",
