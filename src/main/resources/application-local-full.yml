spring:
  config:
    activate:
      on-profile: local-full
  lifecycle:
    timeout-per-shutdown-phase: 30s
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
      table-prefix: batch.batch_

server:
  address: 0.0.0.0

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

ax:
  auth:
    jwt:
      access-token-lifetime: ${AXMS_AUTH_ACCESS_TOKEN_LIFETIME:15m}
      refresh-token-lifetime: ${AXMS_AUTH_REFRESH_TOKEN_LIFETIME:7d}
      issuer: ${AXMS_AUTH_JWT_ISSUER:ax-module-studio}
      access-audience: ${AXMS_AUTH_ACCESS_AUDIENCE:axms-api}
      refresh-audience: ${AXMS_AUTH_REFRESH_AUDIENCE:axms-refresh}
      signing-key-file: ${AXMS_AUTH_JWT_SIGNING_KEY_FILE:/run/secrets/auth_jwt_signing_key}
      secure-refresh-cookie: ${AXMS_AUTH_SECURE_REFRESH_COOKIE:false}
    # The first administrators cannot be created through the product: there is no
    # sign-up. A blank password leaves that account uncreated rather than creating
    # one nobody can sign in to.
    bootstrap:
      enabled: ${AXMS_AUTH_BOOTSTRAP_ENABLED:true}
      super-admin-login-id: ${AXMS_AUTH_SUPER_ADMIN_LOGIN_ID:super-admin}
      super-admin-password: ${AXMS_AUTH_SUPER_ADMIN_PASSWORD:}
      general-admin-login-id: ${AXMS_AUTH_GENERAL_ADMIN_LOGIN_ID:general-admin}
      general-admin-password: ${AXMS_AUTH_GENERAL_ADMIN_PASSWORD:}
      general-user-login-id: ${AXMS_AUTH_GENERAL_USER_LOGIN_ID:general-user}
      general-user-password: ${AXMS_AUTH_GENERAL_USER_PASSWORD:}
  coding:
    model-turn-bridge:
      local-mock-tool-candidate-enabled: true
  local-provider-secrets:
    trusted-proxy-host: ${AXMS_CMS_TRUSTED_PROXY_HOST:nginx}
  product-runtime:
    jdbc-url: ${AXMS_CORE_DB_JDBC_URL:jdbc:postgresql://database:5432/ax_module_studio}
    database-password-file: ${AXMS_CORE_DB_PASSWORD_FILE:/run/secrets/cms_app_password}
    valkey-host: ${AXMS_VALKEY_HOST:valkey}
    valkey-port: ${AXMS_VALKEY_PORT:6379}
    valkey-password-file: ${AXMS_VALKEY_PASSWORD_FILE:/run/secrets/valkey_password}
    product-queue: ${AXMS_PRODUCT_QUEUE:axms:product:jobs:v1}
    coding-queue: ${AXMS_CODING_QUEUE:axms:coding:jobs:v1}
    outbox-lease: ${AXMS_OUTBOX_LEASE:15s}
    outbox-poll: ${AXMS_OUTBOX_POLL:250ms}
    worker-poll: ${AXMS_WORKER_POLL:300ms}
    worker-id: ${AXMS_PRODUCT_WORKER_ID:axms-spring-app-local-1}
  knowledge:
    # /api/public/chat/query가 사용할 공개 chatbot 하나. 비워 두면 공개 API는 항상 404다.
    # 시연 데이터를 만든 뒤 chatbotId를 넣고 spring-core를 한 번 재기동한다.
    public-chatbot-id: ${AXMS_PUBLIC_CHATBOT_ID:}
    public-chat-llm:
      # 공개 답변을 LLM 산문으로 다시 쓴다. 이 제품에서 유료 provider 호출을 여는
      # 유일한 스위치다. 꺼 두면 추출식 답변이 그대로 나가므로 기록된 검색·인용·
      # 거절 기준선(P2·P3·P4·P6·P5-c)이 그대로 재현된다.
      enabled: ${AXMS_PUBLIC_CHAT_LLM:false}
      # 벽시계 상한. 넘기면 추출식으로 폴백한다. nginx proxy_read_timeout 60s보다
      # 앞서 끊어야 익명 호출자가 504 대신 정상 답변을 받는다.
      timeout: ${AXMS_PUBLIC_CHAT_LLM_TIMEOUT:20s}
      # 비워 두면 등록된 모델 중 가장 싼 것으로 떨어진다(claude-haiku-4-5-20251001).
      # 이미지 재빌드가 실측 4.9분이라 모델 교체는 코드가 아니라 환경으로 한다.
      provider: ${AXMS_PUBLIC_CHAT_LLM_PROVIDER:ANTHROPIC}
      model: ${AXMS_PUBLIC_CHAT_LLM_MODEL:}
    chunking-llm:
      # 빌드의 CHUNK 단계에서 LLM이 청킹 규칙을 정한다(AI02-018). 챗봇 스위치와 분리한
      # 이유는 과금 성격이 달라서다 — 챗봇은 질의마다, 이쪽은 빌드 한 번에 한 번이다.
      # 꺼 두면 문서당 1청크로 기존과 동일하게 동작한다.
      enabled: ${AXMS_CHUNKING_LLM:false}
      # 벽시계 상한. 넘기면 전략 없이 계속 진행한다 — 8분짜리 빌드를 여기서 죽이지 않는다.
      timeout: ${AXMS_CHUNKING_LLM_TIMEOUT:30s}
      provider: ${AXMS_CHUNKING_LLM_PROVIDER:ANTHROPIC}
      model: ${AXMS_CHUNKING_LLM_MODEL:}
    evaluation-llm:
      # 골든 질문 평가셋 생성(AI02-020). 빌드가 아니라 관리자의 명시적 생성 요청에서만,
      # 지식베이스당 한 번 호출된다. 검수·동결(CONFIRMED) 전의 세트는 어떤 점수에도
      # 쓰이지 않는다. 꺼 두면 생성이 거절되고 평가는 기존 제목 자가검색 그대로다.
      enabled: ${AXMS_EVAL_LLM:false}
      # 호출 한 번의 벽시계 상한. 생성은 빌드 밖에서 돌므로 빌드 시간과 무관하다.
      timeout: ${AXMS_EVAL_LLM_TIMEOUT:30s}
      provider: ${AXMS_EVAL_LLM_PROVIDER:ANTHROPIC}
      model: ${AXMS_EVAL_LLM_MODEL:}
    source-monitor:
      # 원천 API를 주기 조회해 활성 버전과의 차이(신규·수정·소멸)를 요약으로만 기록한다
      # (AI02-022). 빌드·활성화는 절대 하지 않는다 — 알림 재료를 만들 뿐이다. 기본 꺼짐.
      enabled: ${AXMS_SOURCE_MONITOR:false}
      # 원천 갱신이 평일 오후 배치 1회로 관측돼 6시간이면 넉넉하다. 시연 때만 짧게 줄인다.
      interval: ${AXMS_SOURCE_MONITOR_INTERVAL:6h}
      initial-delay: ${AXMS_SOURCE_MONITOR_INITIAL_DELAY:2m}
    diagnosis-llm:
      # 품질 진단 에이전트(AI02-027). 관리자가 "왜 이 점수인가"를 물은 순간에만 돌고,
      # 조사 한 번에 모델을 여러 번 부른다 — 다른 세 스위치와 과금 성격이 또 다르다.
      enabled: ${AXMS_DIAGNOSIS_LLM:false}
      # 모델 호출 한 번의 상한. budget은 조사 전체(도구 실행 포함)의 상한이다.
      timeout: ${AXMS_DIAGNOSIS_LLM_TIMEOUT:30s}
      budget: ${AXMS_DIAGNOSIS_BUDGET:90s}
      # 정상 조사는 개요2 + 채점1 + 원문2 = 5회다. 나머지는 모델이 헤맬 때의 여유.
      max-tool-calls: ${AXMS_DIAGNOSIS_MAX_TOOL_CALLS:8}
      provider: ${AXMS_DIAGNOSIS_LLM_PROVIDER:ANTHROPIC}
      model: ${AXMS_DIAGNOSIS_LLM_MODEL:}
    embedding:
      # 임베딩 서비스는 컨테이너 밖 호스트에서 동작한다. Compose를 바꾸지 않고
      # 컨테이너가 호스트에 닿도록 host.docker.internal을 기본값으로 둔다.
      base-url: ${AXMS_EMBEDDING_BASE_URL:http://host.docker.internal:8900}
      # 전량을 한 요청에 넣으면 read timeout에 걸린다. 건당 수백 ms 기준으로 끊는다.
      batch-size: ${AXMS_EMBEDDING_BATCH_SIZE:48}
      dimension: ${AXMS_EMBEDDING_DIMENSION:1024}
      connect-timeout: ${AXMS_EMBEDDING_CONNECT_TIMEOUT:5s}
      request-timeout: ${AXMS_EMBEDDING_REQUEST_TIMEOUT:180s}
      # 단건 질의 전용. 실측 107~233ms이므로 15s면 약 64배 여유다. 그 이상 걸리면
      # 대기가 아니라 장애다. nginx proxy_read_timeout 60s보다 앞서 끊어야
      # 익명 호출자에게 504 대신 정상 ErrorEnvelope가 나간다.
      query-request-timeout: ${AXMS_EMBEDDING_QUERY_REQUEST_TIMEOUT:15s}

logging:
  level:
    org.urizo.axmodulestudio: INFO
