spring:
  application:
    name: ax-module-studio-backend
  ai:
    mcp:
      client:
        enabled: false
        toolcallback:
          enabled: false
  main:
    banner-mode: "off"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  flyway:
    enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 0.0

ax:
  ai:
    provider-lane: ${AX_AI_PROVIDER_LANE:PRODUCT}
    mcp-platform:
      enabled: ${AXMS_MCP_PLATFORM_ENABLED:false}
      endpoint: ${AXMS_MCP_PLATFORM_ENDPOINT:http://127.0.0.1:8091/mcp}
      credential-file: ${AXMS_MCP_PLATFORM_CREDENTIAL_FILE:.local/secrets/mcp_service_token}
      connect-timeout: ${AXMS_MCP_PLATFORM_CONNECT_TIMEOUT:3s}
      request-timeout: ${AXMS_MCP_PLATFORM_REQUEST_TIMEOUT:5s}
      max-response-bytes: ${AXMS_MCP_PLATFORM_MAX_RESPONSE_BYTES:65536}
  coding:
    job-lifecycle:
      enabled: false
    model-turn-bridge:
      enabled: false
