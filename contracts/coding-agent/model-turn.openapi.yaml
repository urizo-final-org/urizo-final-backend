{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "AX Module Studio Spring Coding Model Gateway",
    "version": "1.0.0",
    "description": "Private Spring-to-LangGraph contract. Python requests capabilities; Spring selects the provider/model and never exposes provider credentials. Returned tool calls are candidates, not execution commands."
  },
  "servers": [
    {
      "url": "http://spring-backend:8080",
      "description": "Private runtime network only"
    }
  ],
  "paths": {
    "/internal/coding/worker/jobs/{jobId}/claim-context": {
      "get": {
        "operationId": "resolveCodingJobClaimContext",
        "summary": "Resolve one DB-authoritative coding claim context from a queued jobId",
        "security": [{ "serviceCredential": [] }],
        "parameters": [{ "$ref": "#/components/parameters/JobIdPath" }],
        "responses": {
          "200": {
            "description": "Stable claim input and immutable Profile Version binding",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ClaimContextResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/ContractError" },
          "401": { "$ref": "#/components/responses/AuthenticationError" },
          "404": { "$ref": "#/components/responses/ClaimContextNotFound" },
          "409": { "$ref": "#/components/responses/ClaimContextConflict" },
          "503": { "$ref": "#/components/responses/ResolutionUnavailable" }
        }
      }
    },
    "/internal/coding/model-turns": {
      "post": {
        "operationId": "createCodingModelTurn",
        "summary": "Execute one normalized coding model turn",
        "security": [{ "serviceCredential": [] }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/ModelTurnRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Normalized assistant response",
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ModelTurnResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/ContractError" },
          "401": { "$ref": "#/components/responses/AuthenticationError" },
          "403": { "$ref": "#/components/responses/AuthorizationError" },
          "404": { "$ref": "#/components/responses/JobNotFound" },
          "409": { "$ref": "#/components/responses/StateConflict" },
          "422": { "$ref": "#/components/responses/ModelResponseInvalid" },
          "429": { "$ref": "#/components/responses/RateLimited" },
          "503": { "$ref": "#/components/responses/ProviderUnavailable" },
          "504": { "$ref": "#/components/responses/DeadlineExceeded" }
        }
      }
    },
    "/internal/coding/tool-requests": {
      "post": {
        "operationId": "submitCodingToolRequest",
        "summary": "Validate and execute one approved Tool Gateway request",
        "security": [{ "serviceCredential": [] }],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "tool-request.schema.json#/$defs/ToolRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Bounded execution completed synchronously",
            "content": {
              "application/json": {
                "schema": { "$ref": "tool-request.schema.json#/$defs/ToolTerminalResult" }
              }
            }
          },
          "202": {
            "description": "Long-running execution accepted",
            "headers": {
              "Location": {
                "required": true,
                "schema": { "type": "string", "format": "uri-reference" }
              },
              "Retry-After": {
                "required": true,
                "schema": { "type": "integer", "minimum": 1, "maximum": 60 }
              }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "tool-request.schema.json#/$defs/ToolAccepted" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/ContractError" },
          "401": { "$ref": "#/components/responses/AuthenticationError" },
          "403": { "$ref": "#/components/responses/ToolPolicyDenied" },
          "404": { "$ref": "#/components/responses/JobNotFound" },
          "409": { "$ref": "#/components/responses/ToolStateConflict" },
          "422": { "$ref": "#/components/responses/ToolRequestInvalid" },
          "503": { "$ref": "#/components/responses/ToolExecutorUnavailable" }
        }
      }
    },
    "/internal/coding/tool-executions/{executionId}": {
      "get": {
        "operationId": "getCodingToolExecution",
        "summary": "Read accepted or terminal execution status without re-executing",
        "security": [{ "serviceCredential": [] }],
        "parameters": [{ "$ref": "#/components/parameters/ExecutionIdPath" }],
        "responses": {
          "200": {
            "description": "Current execution status",
            "content": {
              "application/json": {
                "schema": { "$ref": "tool-request.schema.json#/$defs/ToolExecutionStatus" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/ContractError" },
          "401": { "$ref": "#/components/responses/AuthenticationError" },
          "403": { "$ref": "#/components/responses/AuthorizationError" },
          "404": { "$ref": "#/components/responses/ToolExecutionNotFound" },
          "503": { "$ref": "#/components/responses/ToolExecutorUnavailable" }
        }
      }
    },
    "/internal/coding/tool-executions/{executionId}/result": {
      "get": {
        "operationId": "getCodingToolExecutionResult",
        "summary": "Fetch the immutable digest-bound sanitized result",
        "security": [{ "serviceCredential": [] }],
        "parameters": [{ "$ref": "#/components/parameters/ExecutionIdPath" }],
        "responses": {
          "200": {
            "description": "Sanitized result content",
            "content": {
              "application/json": {
                "schema": { "$ref": "tool-request.schema.json#/$defs/ToolResultContent" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/ContractError" },
          "401": { "$ref": "#/components/responses/AuthenticationError" },
          "403": { "$ref": "#/components/responses/AuthorizationError" },
          "404": { "$ref": "#/components/responses/ToolExecutionNotFound" },
          "409": { "$ref": "#/components/responses/ToolResultNotReady" },
          "503": { "$ref": "#/components/responses/ToolExecutorUnavailable" }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "serviceCredential": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "rotating-opaque-service-credential",
        "description": "A rotating service credential. Its value never appears in a payload, fixture, trace, or error."
      }
    },
    "parameters": {
      "JobIdPath": {
        "name": "jobId",
        "in": "path",
        "required": true,
        "schema": { "$ref": "#/components/schemas/Uuid" }
      },
      "ExecutionIdPath": {
        "name": "executionId",
        "in": "path",
        "required": true,
        "schema": { "$ref": "#/components/schemas/Uuid" }
      }
    },
    "headers": {
      "BearerChallenge": {
        "required": true,
        "schema": { "type": "string", "const": "Bearer" }
      }
    },
    "responses": {
      "ContractError": {
        "description": "Contract validation or schema version error",
        "x-error-codes": ["CONTRACT_VALIDATION_FAILED", "UNSUPPORTED_SCHEMA_VERSION", "UNKNOWN_FIELD"],
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/PreContextErrorEnvelope" } } }
      },
      "AuthenticationError": {
        "description": "Service authentication failed",
        "x-error-codes": ["SERVICE_AUTHENTICATION_FAILED"],
        "headers": {
          "WWW-Authenticate": { "$ref": "#/components/headers/BearerChallenge" }
        },
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/PreContextErrorEnvelope" } } }
      },
      "ClaimContextNotFound": {
        "description": "The queued identifier does not resolve to an authoritative coding job",
        "x-error-codes": ["JOB_NOT_FOUND"],
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/PreContextErrorEnvelope" } } }
      },
      "ClaimContextConflict": {
        "description": "The job cannot reconstruct a trustworthy claim context",
        "x-error-codes": ["JOB_STATE_VERSION_CONFLICT"],
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/PreContextErrorEnvelope" } } }
      },
      "ResolutionUnavailable": {
        "description": "The authoritative claim-context store is temporarily unavailable",
        "x-error-codes": ["INTERNAL_TRANSIENT_ERROR"],
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/PreContextErrorEnvelope" } } }
      },
      "AuthorizationError": {
        "description": "Service or job scope is not authorized",
        "x-error-codes": ["SERVICE_AUTHORIZATION_DENIED"],
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/ErrorEnvelope" } } }
      },
      "JobNotFound": {
        "description": "Job not found in the authoritative Core database",
        "x-error-codes": ["JOB_NOT_FOUND", "JOB_EXPIRED"],
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/JobScopedErrorEnvelope" } } }
      },
      "StateConflict": {
        "description": "Job state version or idempotency conflict",
        "x-error-codes": ["JOB_STATE_VERSION_CONFLICT", "IDEMPOTENCY_KEY_REUSED", "IDEMPOTENCY_IN_PROGRESS"],
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/JobScopedErrorEnvelope" } } }
      },
      "ModelResponseInvalid": {
        "description": "Model output is still invalid after the single permitted repair",
        "x-error-codes": ["MODEL_RESPONSE_INVALID"],
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/JobScopedErrorEnvelope" } } }
      },
      "RateLimited": {
        "description": "Selected provider rate limited the request",
        "x-error-codes": ["MODEL_RATE_LIMITED"],
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/JobScopedErrorEnvelope" } } }
      },
      "ProviderUnavailable": {
        "description": "No configured provider can currently satisfy the required capabilities",
        "x-error-codes": ["MODEL_NOT_CONFIGURED", "MODEL_CAPABILITY_UNSUPPORTED", "MODEL_PROVIDER_UNAVAILABLE", "CODING_AGENT_NOT_AVAILABLE"],
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/JobScopedErrorEnvelope" } } }
      },
      "DeadlineExceeded": {
        "description": "The model turn exceeded the original absolute deadline",
        "x-error-codes": ["MODEL_TIMEOUT"],
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/JobScopedErrorEnvelope" } } }
      },
      "ToolRequestInvalid": {
        "description": "Tool arguments do not match the registered schema",
        "x-error-codes": ["TOOL_ARGUMENTS_INVALID"],
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/JobScopedErrorEnvelope" } } }
      },
      "ToolExecutionNotFound": {
        "description": "Tool execution not found for the supplied execution identifier",
        "x-error-codes": ["TOOL_EXECUTION_NOT_FOUND"],
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/ExecutionContextErrorEnvelope" } } }
      },
      "ToolResultNotReady": {
        "description": "The accepted execution has not produced an immutable result yet",
        "x-error-codes": ["TOOL_RESULT_NOT_READY"],
        "headers": {
          "Retry-After": {
            "required": true,
            "schema": { "type": "integer", "minimum": 1, "maximum": 60 }
          }
        },
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/ExecutionContextErrorEnvelope" } } }
      },
      "ToolExecutorUnavailable": {
        "description": "The isolated Tool Executor is temporarily unavailable",
        "x-error-codes": ["TOOL_EXECUTOR_UNAVAILABLE", "INTERNAL_TRANSIENT_ERROR"],
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/JobScopedErrorEnvelope" } } }
      },
      "ToolPolicyDenied": {
        "description": "Tool, path, repository, or approval policy denied execution",
        "x-error-codes": ["SERVICE_AUTHORIZATION_DENIED", "TOOL_NOT_ALLOWED", "PATH_POLICY_DENIED", "REPOSITORY_SCOPE_DENIED", "TOOL_APPROVAL_REQUIRED", "TOOL_APPROVAL_DENIED", "TOOL_APPROVAL_EXPIRED"],
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/JobScopedErrorEnvelope" } } }
      },
      "ToolStateConflict": {
        "description": "Job, candidate, context, or idempotency state no longer matches",
        "x-error-codes": ["JOB_STATE_VERSION_CONFLICT", "IDEMPOTENCY_KEY_REUSED", "IDEMPOTENCY_IN_PROGRESS", "CANDIDATE_SHA_MISMATCH", "CONTEXT_DIGEST_MISMATCH"],
        "content": { "application/json": { "schema": { "$ref": "error-code.schema.json#/$defs/JobScopedErrorEnvelope" } } }
      }
    },
    "schemas": {
      "SchemaVersion": { "type": "string", "const": "1.0" },
      "Uuid": { "type": "string", "format": "uuid" },
      "IdempotencyKey": {
        "type": "string",
        "minLength": 8,
        "maxLength": 128,
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
      },
      "Sha256Digest": {
        "type": "string",
        "pattern": "^sha256:[0-9a-f]{64}$"
      },
      "GitObjectId": {
        "type": "string",
        "pattern": "^(sha1:[0-9a-f]{40}|sha256:[0-9a-f]{64})$"
      },
      "ClaimContextResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["schemaVersion", "eventId", "eventType", "jobId", "traceId", "idempotencyKey", "attempt", "expectedStateVersion", "occurredAt", "profileVersionId", "pipelineAttempt", "executionAttempt", "workspaceId", "toolCallId", "payload"],
        "properties": {
          "schemaVersion": { "$ref": "#/components/schemas/SchemaVersion" },
          "eventId": { "$ref": "#/components/schemas/Uuid" },
          "eventType": { "type": "string", "const": "CODING_JOB_REQUESTED" },
          "jobId": { "$ref": "#/components/schemas/Uuid" },
          "traceId": { "$ref": "#/components/schemas/Uuid" },
          "idempotencyKey": { "$ref": "#/components/schemas/IdempotencyKey" },
          "attempt": { "type": "integer", "minimum": 1 },
          "expectedStateVersion": { "type": "integer", "minimum": 1 },
          "occurredAt": { "type": "string", "format": "date-time" },
          "profileVersionId": { "$ref": "#/components/schemas/Uuid" },
          "pipelineAttempt": { "type": "integer", "minimum": 1 },
          "executionAttempt": { "type": "integer", "minimum": 1 },
          "workspaceId": { "type": ["string", "null"], "format": "uuid" },
          "toolCallId": { "type": ["string", "null"], "format": "uuid" },
          "payload": { "$ref": "#/components/schemas/ClaimJobPayload" }
        }
      },
      "ClaimJobPayload": {
        "type": "object",
        "additionalProperties": false,
        "required": ["actorId", "projectId", "repositoryId", "graphStep", "baseSha", "contextDigest", "policyHash", "expiresAt"],
        "properties": {
          "actorId": { "$ref": "#/components/schemas/Uuid" },
          "projectId": { "$ref": "#/components/schemas/Uuid" },
          "repositoryId": { "$ref": "#/components/schemas/Uuid" },
          "graphStep": { "type": "string", "minLength": 1, "maxLength": 120, "pattern": "^[a-z][a-z0-9_-]*$" },
          "baseSha": { "$ref": "#/components/schemas/GitObjectId" },
          "contextDigest": { "$ref": "#/components/schemas/Sha256Digest" },
          "policyHash": { "$ref": "#/components/schemas/Sha256Digest" },
          "expiresAt": { "type": "string", "format": "date-time" }
        }
      },
      "Capability": {
        "type": "string",
        "enum": ["CHAT", "STRUCTURED_OUTPUT", "TOOL_CALLING"]
      },
      "ModelTurnRequest": {
        "type": "object",
        "additionalProperties": false,
        "allOf": [
          {
            "if": {
              "properties": {
                "requiredCapabilities": {
                  "contains": { "const": "TOOL_CALLING" }
                }
              },
              "required": ["requiredCapabilities"]
            },
            "then": {
              "properties": { "toolSchemas": { "minItems": 1 } }
            },
            "else": {
              "properties": { "toolSchemas": { "maxItems": 0 } }
            }
          },
          {
            "if": {
              "properties": {
                "responseFormat": {
                  "properties": { "type": { "const": "JSON_SCHEMA" } },
                  "required": ["type"]
                }
              },
              "required": ["responseFormat"]
            },
            "then": {
              "properties": {
                "requiredCapabilities": {
                  "contains": { "const": "STRUCTURED_OUTPUT" }
                }
              }
            },
            "else": {
              "properties": {
                "requiredCapabilities": {
                  "not": { "contains": { "const": "STRUCTURED_OUTPUT" } }
                }
              }
            }
          }
        ],
        "not": {
          "properties": {
            "requiredCapabilities": {
              "allOf": [
                { "contains": { "const": "STRUCTURED_OUTPUT" } },
                { "contains": { "const": "TOOL_CALLING" } }
              ]
            }
          },
          "required": ["requiredCapabilities"]
        },
        "required": ["schemaVersion", "turnId", "jobId", "traceId", "idempotencyKey", "attempt", "expectedStateVersion", "nodeName", "promptVersion", "contextDigest", "requiredCapabilities", "messages", "toolSchemas", "responseFormat", "deadlineAt"],
        "properties": {
          "schemaVersion": { "$ref": "#/components/schemas/SchemaVersion" },
          "turnId": { "$ref": "#/components/schemas/Uuid" },
          "jobId": { "$ref": "#/components/schemas/Uuid" },
          "traceId": { "$ref": "#/components/schemas/Uuid" },
          "idempotencyKey": { "$ref": "#/components/schemas/IdempotencyKey" },
          "attempt": { "type": "integer", "minimum": 1 },
          "expectedStateVersion": { "type": "integer", "minimum": 1 },
          "nodeName": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120,
            "pattern": "^[a-z][a-z0-9_-]*$"
          },
          "promptVersion": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120,
            "pattern": "^[A-Za-z0-9._-]+$"
          },
          "contextDigest": { "$ref": "#/components/schemas/Sha256Digest" },
          "requiredCapabilities": {
            "type": "array",
            "minItems": 1,
            "uniqueItems": true,
            "items": { "$ref": "#/components/schemas/Capability" }
          },
          "messages": {
            "type": "array",
            "minItems": 1,
            "maxItems": 200,
            "items": { "$ref": "#/components/schemas/InputMessage" }
          },
          "toolSchemas": {
            "type": "array",
            "maxItems": 50,
            "items": { "$ref": "#/components/schemas/ToolSchema" }
          },
          "responseFormat": { "$ref": "#/components/schemas/ResponseFormatRequest" },
          "deadlineAt": { "type": "string", "format": "date-time" }
        }
      },
      "InputMessage": {
        "oneOf": [
          { "$ref": "#/components/schemas/TextMessage" },
          { "$ref": "#/components/schemas/AssistantToolCallMessage" },
          { "$ref": "#/components/schemas/ToolResultMessage" }
        ]
      },
      "TextMessage": {
        "type": "object",
        "additionalProperties": false,
        "required": ["role", "content"],
        "properties": {
          "role": { "type": "string", "enum": ["system", "user", "assistant"] },
          "content": { "type": "string", "minLength": 1, "maxLength": 200000 }
        }
      },
      "ToolResultMessage": {
        "type": "object",
        "additionalProperties": false,
        "required": ["role", "toolCallId", "executionId", "result", "content"],
        "properties": {
          "role": { "type": "string", "const": "tool" },
          "toolCallId": { "$ref": "#/components/schemas/Uuid" },
          "executionId": { "$ref": "#/components/schemas/Uuid" },
          "result": { "$ref": "tool-request.schema.json#/$defs/ResultReference" },
          "content": {
            "type": "string",
            "maxLength": 200000,
            "description": "Sanitized content fetched from result.resultRef; empty results are valid. The Gateway verifies the UTF-8 byte length and SHA-256 digest before invoking a model."
          }
        }
      },
      "AssistantToolCallMessage": {
        "type": "object",
        "additionalProperties": false,
        "required": ["role", "content", "toolCalls"],
        "properties": {
          "role": { "type": "string", "const": "assistant" },
          "content": { "type": "string", "maxLength": 200000 },
          "toolCalls": {
            "type": "array",
            "minItems": 1,
            "maxItems": 50,
            "items": { "$ref": "#/components/schemas/ToolCallCandidate" }
          }
        }
      },
      "ToolSchema": {
        "type": "object",
        "additionalProperties": false,
        "required": ["name", "description", "inputSchema", "schemaDigest"],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120,
            "pattern": "^[a-z][a-z0-9_]*$"
          },
          "description": { "type": "string", "minLength": 1, "maxLength": 2000 },
          "inputSchema": {
            "type": "object",
            "description": "Explicit extension island containing the registered JSON Schema for this tool.",
            "additionalProperties": true
          },
          "schemaDigest": { "$ref": "#/components/schemas/Sha256Digest" }
        }
      },
      "ResponseFormatRequest": {
        "oneOf": [
          { "$ref": "#/components/schemas/TextResponseFormatRequest" },
          { "$ref": "#/components/schemas/JsonSchemaResponseFormatRequest" }
        ]
      },
      "TextResponseFormatRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["type"],
        "properties": {
          "type": { "type": "string", "const": "TEXT" }
        }
      },
      "JsonSchemaResponseFormatRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["type", "schemaDigest", "outputSchema"],
        "properties": {
          "type": { "type": "string", "const": "JSON_SCHEMA" },
          "schemaDigest": { "$ref": "#/components/schemas/Sha256Digest" },
          "outputSchema": {
            "type": "object",
            "description": "Explicit extension island containing the requested Draft 2020-12 output schema.",
            "additionalProperties": true
          }
        }
      },
      "ResponseFormatResult": {
        "oneOf": [
          { "$ref": "#/components/schemas/TextResponseFormatResult" },
          { "$ref": "#/components/schemas/JsonSchemaResponseFormatResult" }
        ]
      },
      "TextResponseFormatResult": {
        "type": "object",
        "additionalProperties": false,
        "required": ["type"],
        "properties": {
          "type": { "type": "string", "const": "TEXT" }
        }
      },
      "JsonSchemaResponseFormatResult": {
        "type": "object",
        "additionalProperties": false,
        "required": ["type", "schemaDigest", "structuredOutput"],
        "properties": {
          "type": { "type": "string", "const": "JSON_SCHEMA" },
          "schemaDigest": { "$ref": "#/components/schemas/Sha256Digest" },
          "structuredOutput": {
            "type": "object",
            "description": "Explicit extension island validated against the request schema identified by schemaDigest.",
            "additionalProperties": true
          }
        }
      },
      "ModelTurnResponse": {
        "type": "object",
        "additionalProperties": false,
        "allOf": [
          {
            "if": {
              "properties": { "finishReason": { "const": "TOOL_CALLS" } },
              "required": ["finishReason"]
            },
            "then": {
              "properties": {
                "toolCalls": { "minItems": 1 },
                "responseFormat": {
                  "properties": { "type": { "const": "TEXT" } },
                  "required": ["type"]
                }
              }
            },
            "else": {
              "properties": { "toolCalls": { "maxItems": 0 } }
            }
          }
        ],
        "required": ["schemaVersion", "turnId", "jobId", "traceId", "idempotencyKey", "assistant", "toolCalls", "responseFormat", "selectedModel", "usage", "latencyMs", "finishReason", "completedAt"],
        "properties": {
          "schemaVersion": { "$ref": "#/components/schemas/SchemaVersion" },
          "turnId": { "$ref": "#/components/schemas/Uuid" },
          "jobId": { "$ref": "#/components/schemas/Uuid" },
          "traceId": { "$ref": "#/components/schemas/Uuid" },
          "idempotencyKey": { "$ref": "#/components/schemas/IdempotencyKey" },
          "assistant": { "$ref": "#/components/schemas/AssistantMessage" },
          "toolCalls": {
            "type": "array",
            "maxItems": 50,
            "items": { "$ref": "#/components/schemas/ToolCallCandidate" }
          },
          "responseFormat": { "$ref": "#/components/schemas/ResponseFormatResult" },
          "selectedModel": { "$ref": "#/components/schemas/SelectedModel" },
          "usage": { "$ref": "#/components/schemas/TokenUsage" },
          "latencyMs": { "type": "integer", "minimum": 0 },
          "finishReason": { "type": "string", "enum": ["STOP", "TOOL_CALLS", "LENGTH", "CONTENT_FILTER"] },
          "completedAt": { "type": "string", "format": "date-time" }
        }
      },
      "AssistantMessage": {
        "type": "object",
        "additionalProperties": false,
        "required": ["role", "content"],
        "properties": {
          "role": { "type": "string", "const": "assistant" },
          "content": { "type": "string", "maxLength": 200000 }
        }
      },
      "ToolCallCandidate": {
        "type": "object",
        "additionalProperties": false,
        "required": ["toolCallId", "name", "arguments"],
        "properties": {
          "toolCallId": { "$ref": "#/components/schemas/Uuid" },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 120,
            "pattern": "^[a-z][a-z0-9_]*$"
          },
          "arguments": {
            "type": "object",
            "description": "Candidate arguments only; Spring Tool Gateway validates them again before execution.",
            "additionalProperties": true
          }
        }
      },
      "SelectedModel": {
        "type": "object",
        "additionalProperties": false,
        "required": ["provider", "modelId"],
        "properties": {
          "provider": { "type": "string", "enum": ["OPENAI", "ANTHROPIC", "GOOGLE", "LOCAL"] },
          "modelId": { "type": "string", "minLength": 1, "maxLength": 200 }
        }
      },
      "TokenUsage": {
        "type": "object",
        "additionalProperties": false,
        "required": ["inputTokens", "outputTokens", "totalTokens"],
        "properties": {
          "inputTokens": { "type": "integer", "minimum": 0 },
          "outputTokens": { "type": "integer", "minimum": 0 },
          "totalTokens": { "type": "integer", "minimum": 0 }
        }
      }
    }
  }
}
