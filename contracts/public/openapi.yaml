  },
  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "parameters": {
      "TraceIdHeader": {
        "name": "X-Trace-Id",
        "in": "header",
        "required": false,
        "description": "Existing RFC 4122 trace identifier. Invalid supplied values are rejected rather than silently replaced.",
        "schema": { "$ref": "#/components/schemas/Uuid" }
      },
      "IdempotencyKeyHeader": {
        "name": "Idempotency-Key",
        "in": "header",
        "required": true,
        "description": "Reuse for transport retries of the same semantic request.",
        "schema": { "$ref": "#/components/schemas/IdempotencyKey" }
      },
      "ProjectIdPath": {
        "name": "projectId",
        "in": "path",
        "required": true,
        "schema": { "$ref": "#/components/schemas/Uuid" }
      },
      "ProjectIdQuery": {
        "name": "projectId",
        "in": "query",
        "required": true,
        "schema": { "$ref": "#/components/schemas/Uuid" }
      },
      "ConnectorIdPath": {
        "name": "connectorId",
        "in": "path",
        "required": true,
        "schema": { "$ref": "#/components/schemas/Uuid" }
      },
      "ConnectorVersionIdPath": {
        "name": "connectorVersionId",
        "in": "path",
        "required": true,
        "schema": { "$ref": "#/components/schemas/Uuid" }
      },
      "KnowledgeBaseIdPath": {
        "name": "knowledgeBaseId",
        "in": "path",
        "required": true,
        "schema": { "$ref": "#/components/schemas/Uuid" }
      },
      "KnowledgeVersionIdPath": {
        "name": "knowledgeVersionId",
        "in": "path",
        "required": true,
        "schema": { "$ref": "#/components/schemas/Uuid" }
      },
      "ChatbotIdPath": {
        "name": "chatbotId",
        "in": "path",
        "required": true,
        "schema": { "$ref": "#/components/schemas/Uuid" }
      },
      "JobIdPath": {
        "name": "jobId",
        "in": "path",
        "required": true,
        "schema": { "$ref": "#/components/schemas/Uuid" }
      }
    },
    "headers": {
      "TraceId": {
        "required": true,
        "schema": { "$ref": "#/components/schemas/Uuid" }
      },
      "Location": {
        "required": true,
        "schema": { "type": "string", "format": "uri-reference", "minLength": 1 }
      },
      "RetryAfter": {
        "required": true,
        "schema": { "type": "integer", "minimum": 1 }
      },
      "BearerChallenge": {
        "required": true,
        "schema": { "type": "string", "const": "Bearer" }
      }
    },
    "responses": {
      "ConnectorSyncAccepted": {
        "description": "Connector sync job accepted",
        "headers": {
          "X-Trace-Id": { "$ref": "#/components/headers/TraceId" },
          "Location": { "$ref": "#/components/headers/Location" },
          "Retry-After": { "$ref": "#/components/headers/RetryAfter" }
        },
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/ConnectorSyncAcceptedResponse" }
          }
        }
      },
      "BadRequest": {
        "description": "Malformed request, invalid trace, or unsupported schema version",
        "x-error-codes": ["VALIDATION_FAILED", "SCHEMA_VERSION_UNSUPPORTED", "INVALID_TRACE_ID", "IDEMPOTENCY_KEY_REQUIRED"],
        "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } }
      },
      "Unauthorized": {
        "description": "Authentication required",
        "x-error-codes": ["AUTHENTICATION_REQUIRED"],
        "headers": {
          "X-Trace-Id": { "$ref": "#/components/headers/TraceId" },
          "WWW-Authenticate": { "$ref": "#/components/headers/BearerChallenge" }
        },
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } }
      },
      "Forbidden": {
        "description": "Operation is not permitted",
        "x-error-codes": ["FORBIDDEN"],
        "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } }
      },
      "NotFound": {
        "description": "Resource not found in the authorized scope",
        "x-error-codes": ["RESOURCE_NOT_FOUND"],
        "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } }
      },
      "Conflict": {
        "description": "State or idempotency conflict",
        "x-error-codes": ["IDEMPOTENCY_KEY_REUSED", "IDEMPOTENCY_REQUEST_IN_PROGRESS", "JOB_STATE_CONFLICT", "KNOWLEDGE_VERSION_NOT_ACTIVE"],
        "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } }
      },
      "UnprocessableEntity": {
        "description": "Syntactically valid request that violates connector or response policy",
        "x-error-codes": ["CONNECTOR_SPEC_INVALID", "CONNECTOR_RESPONSE_INVALID"],
        "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } }
      },
      "TooManyRequests": {
        "description": "Rate limited",
        "x-error-codes": ["RATE_LIMITED"],
        "headers": {
          "X-Trace-Id": { "$ref": "#/components/headers/TraceId" },
          "Retry-After": { "$ref": "#/components/headers/RetryAfter" }
        },
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } }
      },
      "InternalError": {
        "description": "Internal non-secret error",
        "x-error-codes": ["INTERNAL_ERROR"],
        "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } }
      },
      "BadGateway": {
        "description": "Upstream connector or model failure",
        "x-error-codes": ["UPSTREAM_SERVICE_ERROR"],
        "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } }
      },
      "ServiceUnavailable": {
        "description": "Required service or provider unavailable",
        "x-error-codes": ["SERVICE_NOT_READY", "PROVIDER_UNAVAILABLE", "LLM_NOT_CONFIGURED"],
        "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } }
      },
      "GatewayTimeout": {
        "description": "Upstream operation exceeded its bounded timeout",
        "x-error-codes": ["UPSTREAM_TIMEOUT"],
        "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ErrorEnvelope" } } }
      }
    },
    "schemas": {
      "SchemaVersion": { "type": "string", "const": "1.0" },
      "Uuid": { "type": "string", "format": "uuid" },
      "AdminRole": {
        "type": "string",
        "description": "The local CMS demo has two equivalent administrator roles and one read-only user role.",
        "enum": ["SUPER_ADMIN", "GENERAL_ADMIN", "GENERAL_USER"]
      },
      "LoginId": {
        "type": "string",
        "minLength": 1,
        "maxLength": 120
      },
      "PasswordValue": {
        "type": "string",
        "description": "Administrator password. Named to stay outside the credential-shaped key guard while still carrying the only value a login can accept.",
        "minLength": 8,
        "maxLength": 256,
        "writeOnly": true
      },
      "LoginRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["schemaVersion", "loginId", "passwordValue"],
        "properties": {
          "schemaVersion": { "$ref": "#/components/schemas/SchemaVersion" },
          "loginId": { "$ref": "#/components/schemas/LoginId" },
          "passwordValue": { "$ref": "#/components/schemas/PasswordValue" }
        }
      },
      "LoginResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["schemaVersion", "traceId", "sessionToken", "tokenType", "expiresAt", "actor"],
        "properties": {
          "schemaVersion": { "$ref": "#/components/schemas/SchemaVersion" },
          "traceId": { "$ref": "#/components/schemas/Uuid" },
          "sessionToken": {
            "type": "string",
            "description": "Signed short-lived access JWT. Refresh JWTs are stored only as a server-side digest.",
            "minLength": 8
          },
          "tokenType": { "type": "string", "const": "Bearer" },
          "expiresAt": { "type": "string", "format": "date-time" },
          "actor": { "$ref": "#/components/schemas/ActorContext" }
        }
      },
      "ActorContext": {
        "type": "object",
        "additionalProperties": false,
        "description": "Server-derived CMS identity and role.",
        "required": ["actorId", "name", "role"],
        "properties": {
          "actorId": { "$ref": "#/components/schemas/Uuid" },
          "name": { "type": "string", "minLength": 1, "maxLength": 80 },
          "role": { "$ref": "#/components/schemas/AdminRole" }
        }
      },
      "CurrentSessionResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["schemaVersion", "traceId", "actor", "expiresAt"],
        "properties": {
          "schemaVersion": { "$ref": "#/components/schemas/SchemaVersion" },
          "traceId": { "$ref": "#/components/schemas/Uuid" },
          "actor": { "$ref": "#/components/schemas/ActorContext" },
          "expiresAt": { "type": "string", "format": "date-time" }
        }
      },
      "IdempotencyKey": {
        "type": "string",
        "minLength": 8,
        "maxLength": 128,
        "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$"
      },
      "Sha256Digest": {
        "type": "string",
        "pattern": "^sha256:[0-9a-f]{64}$"
      },
      "HealthResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["schemaVersion", "traceId", "status", "checkedAt"],
        "properties": {
          "schemaVersion": { "$ref": "#/components/schemas/SchemaVersion" },
          "traceId": { "$ref": "#/components/schemas/Uuid" },
          "status": { "type": "string", "const": "UP" },
          "checkedAt": { "type": "string", "format": "date-time" }
        }
      },
      "ReadinessResponse": {
        "oneOf": [
          { "$ref": "#/components/schemas/ReadinessReadyResponse" },
          { "$ref": "#/components/schemas/ReadinessNotReadyResponse" }
        ]
      },
      "ReadinessReadyResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["schemaVersion", "traceId", "status", "checkedAt", "checks"],
        "properties": {
          "schemaVersion": { "$ref": "#/components/schemas/SchemaVersion" },
          "traceId": { "$ref": "#/components/schemas/Uuid" },
          "status": { "type": "string", "const": "READY" },
          "checkedAt": { "type": "string", "format": "date-time" },
          "checks": {
            "type": "array",
            "minItems": 3,
            "maxItems": 6,
            "uniqueItems": true,
            "items": { "$ref": "#/components/schemas/ReadinessCheck" },
            "allOf": [
              { "contains": { "const": { "name": "core-database", "status": "UP", "required": true } }, "minContains": 1, "maxContains": 1 },
              { "contains": { "const": { "name": "queue", "status": "UP", "required": true } }, "minContains": 1, "maxContains": 1 },
              { "contains": { "const": { "name": "migrations", "status": "UP", "required": true } }, "minContains": 1, "maxContains": 1 }
            ],
            "not": {
              "contains": {
                "enum": [
                  { "name": "core-database", "status": "DOWN", "required": true },
                  { "name": "queue", "status": "DOWN", "required": true },
                  { "name": "migrations", "status": "DOWN", "required": true }
                ]
              }
            }
          }
        }
      },
      "ReadinessNotReadyResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["schemaVersion", "traceId", "status", "checkedAt", "checks"],
        "properties": {
          "schemaVersion": { "$ref": "#/components/schemas/SchemaVersion" },
          "traceId": { "$ref": "#/components/schemas/Uuid" },
          "status": { "type": "string", "const": "NOT_READY" },
          "checkedAt": { "type": "string", "format": "date-time" },
          "checks": {
            "type": "array",
            "minItems": 1,
            "maxItems": 6,
            "uniqueItems": true,
            "items": { "$ref": "#/components/schemas/ReadinessCheck" },
            "contains": {
              "enum": [
                { "name": "core-database", "status": "DOWN", "required": true },
                { "name": "queue", "status": "DOWN", "required": true },
                { "name": "migrations", "status": "DOWN", "required": true }
              ]
            },
            "minContains": 1
          }
        }
      },
      "ReadinessCheck": {
        "oneOf": [
          { "$ref": "#/components/schemas/RequiredReadinessCheck" },
          { "$ref": "#/components/schemas/OptionalReadinessCheck" }
        ]
      },
      "RequiredReadinessCheck": {
        "type": "object",
        "additionalProperties": false,
        "required": ["name", "status", "required"],
        "properties": {
          "name": { "type": "string", "enum": ["core-database", "queue", "migrations"] },
          "status": { "type": "string", "enum": ["UP", "DOWN"] },
          "required": { "type": "boolean", "const": true }
        }
      },
      "OptionalReadinessCheck": {
        "type": "object",
        "additionalProperties": false,
        "required": ["name", "status", "required"],
        "properties": {
          "name": { "type": "string", "enum": ["coding-agent", "model-provider", "observability"] },
          "status": { "type": "string", "enum": ["UP", "DOWN", "NOT_CONFIGURED"] },
          "required": { "type": "boolean", "const": false }
        }
      },
      "CreateProjectRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": ["schemaVersion", "name"],
        "properties": {
          "schemaVersion": { "$ref": "#/components/schemas/SchemaVersion" },
          "name": { "type": "string", "minLength": 1, "maxLength": 120 },
          "description": { "type": "string", "maxLength": 2000 }
        }
      },
      "ProjectResponse": {
        "type": "object",
        "additionalProperties": false,
        "required": ["schemaVersion", "traceId", "projectId", "name", "status", "createdAt"],
        "properties": {
          "schemaVersion": { "$ref": "#/components/schemas/SchemaVersion" },
          "traceId": { "$ref": "#/components/schemas/Uuid" },
          "projectId": { "$ref": "#/components/schemas/Uuid" },
