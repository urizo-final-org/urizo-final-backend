server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 2m;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://spring-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Browser-visible local development adapters are the only internal routes
    # exposed at the loopback ingress. Service-to-service endpoints stay on the
    # Compose network and are never forwarded by Nginx.
    location ^~ /internal/dev/ {
        proxy_pass http://spring-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The coding runner cannot live inside the Spring container: Docker and Git
    # are not installed there, and mounting the Docker socket into a container
    # that runs unreviewed generated code would hand it the host. It therefore
    # runs on the host and its queue endpoints are the only service-to-service
    # route that has to cross the loopback ingress. The listener is bound to
    # 127.0.0.1 and Spring still verifies the Bearer credential on every call,
    # the same reasoning that lets database_gateway publish 15432 on loopback.
    location ^~ /internal/coding/runner/ {
        proxy_pass http://spring-app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /internal/ {
        return 404;
    }

    location /actuator/ {
        return 404;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }
}
