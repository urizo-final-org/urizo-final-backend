          "type": { "type": "string", "enum": ["CONNECTOR", "CONNECTOR_VERSION", "KNOWLEDGE_BASE", "KNOWLEDGE_VERSION"] },
          "id": { "$ref": "#/components/schemas/Uuid" },
          "digest": { "$ref": "#/components/schemas/Sha256Digest" }
        }
      },
      "JobFailure": {
        "oneOf": [
          { "$ref": "#/components/schemas/NonRetryableJobFailure" },
          { "$ref": "#/components/schemas/RetryableJobFailure" }
        ]
      },
      "NonRetryableJobFailure": {
        "type": "object",
        "additionalProperties": false,
        "required": ["code", "message", "retryable"],
        "properties": {
          "code": {
            "type": "string",
            "enum": ["VALIDATION_FAILED", "CONNECTOR_SPEC_INVALID", "CONNECTOR_RESPONSE_INVALID", "LLM_NOT_CONFIGURED", "INTERNAL_ERROR"]
          },
          "message": { "type": "string", "minLength": 1, "maxLength": 1000 },
          "retryable": { "type": "boolean", "const": false }
        }
      },
      "RetryableJobFailure": {
        "type": "object",
        "additionalProperties": false,
        "required": ["code", "message", "retryable", "retryAfterMs"],
        "properties": {
          "code": {
            "type": "string",
            "enum": ["RATE_LIMITED", "UPSTREAM_SERVICE_ERROR", "PROVIDER_UNAVAILABLE", "SERVICE_NOT_READY", "UPSTREAM_TIMEOUT"]
          },
          "message": { "type": "string", "minLength": 1, "maxLength": 1000 },
          "retryable": { "type": "boolean", "const": true },
          "retryAfterMs": { "type": "integer", "minimum": 1, "maximum": 3600000 }
        }
      },
      "ErrorEnvelope": {
        "type": "object",
        "additionalProperties": false,
        "required": ["schemaVersion", "traceId", "error"],
        "properties": {
          "schemaVersion": { "$ref": "#/components/schemas/SchemaVersion" },
          "traceId": { "$ref": "#/components/schemas/Uuid" },
          "jobId": { "$ref": "#/components/schemas/Uuid" },
          "error": { "$ref": "#/components/schemas/PublicError" }
        }
      },
      "PublicError": {
        "oneOf": [
          { "$ref": "#/components/schemas/NonRetryablePublicError" },
          { "$ref": "#/components/schemas/RetryablePublicError" }
        ]
      },
      "NonRetryablePublicError": {
        "type": "object",
        "additionalProperties": false,
        "required": ["code", "message", "retryable"],
        "properties": {
          "code": {
            "type": "string",
            "enum": ["VALIDATION_FAILED", "SCHEMA_VERSION_UNSUPPORTED", "INVALID_TRACE_ID", "IDEMPOTENCY_KEY_REQUIRED", "IDEMPOTENCY_KEY_REUSED", "AUTHENTICATION_REQUIRED", "FORBIDDEN", "RESOURCE_NOT_FOUND", "JOB_STATE_CONFLICT", "KNOWLEDGE_VERSION_NOT_ACTIVE", "CONNECTOR_SPEC_INVALID", "CONNECTOR_RESPONSE_INVALID", "LLM_NOT_CONFIGURED", "INTERNAL_ERROR"]
          },
          "message": { "type": "string", "minLength": 1, "maxLength": 1000 },
          "retryable": { "type": "boolean", "const": false },
          "details": {
            "type": "array",
            "maxItems": 100,
            "items": { "$ref": "#/components/schemas/ValidationDetail" }
          }
        }
      },
      "RetryablePublicError": {
        "type": "object",
        "additionalProperties": false,
        "required": ["code", "message", "retryable", "retryAfterMs"],
        "properties": {
          "code": {
            "type": "string",
            "enum": ["IDEMPOTENCY_REQUEST_IN_PROGRESS", "RATE_LIMITED", "UPSTREAM_SERVICE_ERROR", "PROVIDER_UNAVAILABLE", "SERVICE_NOT_READY", "UPSTREAM_TIMEOUT"]
          },
          "message": { "type": "string", "minLength": 1, "maxLength": 1000 },
          "retryable": { "type": "boolean", "const": true },
          "retryAfterMs": { "type": "integer", "minimum": 1, "maximum": 3600000 },
          "details": {
            "type": "array",
            "maxItems": 100,
            "items": { "$ref": "#/components/schemas/ValidationDetail" }
          }
        }
      },
      "ValidationDetail": {
        "type": "object",
        "additionalProperties": false,
        "required": ["field", "reason"],
        "properties": {
          "field": { "type": "string", "maxLength": 500, "pattern": "^/" },
          "reason": { "type": "string", "minLength": 1, "maxLength": 1000 }
        }
      }
    }
  }
}
