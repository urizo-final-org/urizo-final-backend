{
  "openapi": "3.1.0",
  "jsonSchemaDialect": "https://json-schema.org/draft/2020-12/schema",
  "info": {
    "title": "AX Module Studio Public API",
    "version": "1.0.0",
    "description": "Runtime-neutral Stage 0 contract. Spring is the primary implementation; a future approved fallback must preserve this boundary."
  },
  "servers": [
    {
      "url": "/",
      "description": "Same-origin API through the frontend gateway"
    }
  ],
  "tags": [
    { "name": "Health" },
    { "name": "Auth" },
    { "name": "Projects" },
    { "name": "Connectors" },
    { "name": "Knowledge" },
    { "name": "RAG" },
    { "name": "Jobs" }
  ],
  "paths": {
    "/api/health": {
      "get": {
        "operationId": "getHealth",
        "tags": ["Health"],
        "summary": "Return process liveness",
        "security": [],
        "parameters": [
          { "$ref": "#/components/parameters/TraceIdHeader" }
        ],
        "responses": {
          "200": {
            "description": "The public API process is alive",
            "headers": {
              "X-Trace-Id": { "$ref": "#/components/headers/TraceId" }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/HealthResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" }
        }
      }
    },
    "/api/readiness": {
      "get": {
        "operationId": "getReadiness",
        "tags": ["Health"],
        "summary": "Return readiness of required P0 dependencies",
        "description": "Missing model keys, LangGraph, or optional observability do not make the P0 API unready.",
        "security": [],
        "parameters": [
          { "$ref": "#/components/parameters/TraceIdHeader" }
        ],
        "responses": {
          "200": {
            "description": "Required dependencies are ready",
            "headers": {
              "X-Trace-Id": { "$ref": "#/components/headers/TraceId" }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ReadinessReadyResponse" }
              }
            }
          },
          "503": {
            "description": "At least one required P0 dependency is not ready",
            "headers": {
              "X-Trace-Id": { "$ref": "#/components/headers/TraceId" }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ReadinessNotReadyResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" }
        }
      }
    },
    "/api/auth/login": {
      "post": {
        "operationId": "login",
        "tags": ["Auth"],
        "summary": "Exchange CMS credentials for an access/refresh JWT pair",
        "description": "Returns a short-lived access JWT and sets the rotating refresh JWT in an HttpOnly same-origin cookie.",
        "security": [],
        "parameters": [
          { "$ref": "#/components/parameters/TraceIdHeader" },
          { "$ref": "#/components/parameters/IdempotencyKeyHeader" }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/LoginRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Session issued",
            "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/LoginResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/api/auth/refresh": {
      "post": {
        "operationId": "refreshSession",
        "tags": ["Auth"],
        "summary": "Rotate the refresh JWT and issue a new access JWT",
        "security": [],
        "parameters": [
          { "$ref": "#/components/parameters/TraceIdHeader" },
          { "$ref": "#/components/parameters/IdempotencyKeyHeader" }
        ],
        "responses": {
          "200": {
            "description": "Refresh JWT rotated",
            "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/LoginResponse" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/api/auth/logout": {
      "post": {
        "operationId": "logout",
        "tags": ["Auth"],
        "summary": "Revoke the refresh JWT and clear its cookie",
        "description": "Logout is idempotent and clears the browser refresh cookie.",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/TraceIdHeader" },
          { "$ref": "#/components/parameters/IdempotencyKeyHeader" }
        ],
        "responses": {
          "204": {
            "description": "Session revoked",
            "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/api/auth/me": {
      "get": {
        "operationId": "getCurrentSession",
        "tags": ["Auth"],
        "summary": "Return the server-derived actor and role",
        "description": "Every field is derived from the validated access JWT and current persisted account.",
        "security": [{ "bearerAuth": [] }],
        "parameters": [{ "$ref": "#/components/parameters/TraceIdHeader" }],
        "responses": {
          "200": {
            "description": "Current session identity",
            "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/CurrentSessionResponse" }
              }
            }
          },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/api/projects": {
      "get": {
        "operationId": "listProjects",
        "tags": ["Projects"],
        "summary": "List projects visible to the current actor",
        "security": [{ "bearerAuth": [] }],
        "parameters": [{ "$ref": "#/components/parameters/TraceIdHeader" }],
        "responses": {
          "200": {
            "description": "Project collection",
            "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ProjectListResponse" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" }
        }
      },
      "post": {
        "operationId": "createProject",
        "tags": ["Projects"],
        "summary": "Create a project",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/TraceIdHeader" },
          { "$ref": "#/components/parameters/IdempotencyKeyHeader" }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/CreateProjectRequest" }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Project created",
            "headers": {
              "X-Trace-Id": { "$ref": "#/components/headers/TraceId" },
              "Location": { "$ref": "#/components/headers/Location" }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ProjectResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "500": { "$ref": "#/components/responses/InternalError" }
        }
      }
    },
    "/api/projects/{projectId}/connectors": {
      "get": {
        "operationId": "listConnectors",
        "tags": ["Connectors"],
        "summary": "List project connectors",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/ProjectIdPath" },
          { "$ref": "#/components/parameters/TraceIdHeader" }
        ],
        "responses": {
          "200": {
            "description": "Connector collection",
            "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ConnectorListResponse" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      },
      "post": {
        "operationId": "createConnector",
        "tags": ["Connectors"],
        "summary": "Create a validated connector draft and immutable version",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/ProjectIdPath" },
          { "$ref": "#/components/parameters/TraceIdHeader" },
          { "$ref": "#/components/parameters/IdempotencyKeyHeader" }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/CreateConnectorRequest" }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Connector draft and immutable version created",
            "headers": {
              "X-Trace-Id": { "$ref": "#/components/headers/TraceId" },
              "Location": { "$ref": "#/components/headers/Location" }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ConnectorResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" }
        }
      }
    },
    "/api/connectors/{connectorId}/preview": {
      "post": {
        "operationId": "previewConnector",
        "tags": ["Connectors"],
        "summary": "Fetch and map a bounded connector sample",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/ConnectorIdPath" },
          { "$ref": "#/components/parameters/TraceIdHeader" },
          { "$ref": "#/components/parameters/IdempotencyKeyHeader" }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/ConnectorPreviewRequest" }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Sanitized preview",
            "headers": {
              "X-Trace-Id": { "$ref": "#/components/headers/TraceId" }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/ConnectorPreviewResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" },
          "422": { "$ref": "#/components/responses/UnprocessableEntity" },
          "502": { "$ref": "#/components/responses/BadGateway" },
          "504": { "$ref": "#/components/responses/GatewayTimeout" }
        }
      }
    },
    "/api/connectors/{connectorId}/sync": {
      "post": {
        "operationId": "syncConnector",
        "tags": ["Connectors"],
        "summary": "Start an asynchronous connector synchronization",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/ConnectorIdPath" },
          { "$ref": "#/components/parameters/TraceIdHeader" },
          { "$ref": "#/components/parameters/IdempotencyKeyHeader" }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/ConnectorSyncRequest" }
            }
          }
        },
        "responses": {
          "202": { "$ref": "#/components/responses/ConnectorSyncAccepted" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/knowledge-bases": {
      "get": {
        "operationId": "listKnowledgeBases",
        "tags": ["Knowledge"],
        "summary": "List project knowledge bases",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/ProjectIdQuery" },
          { "$ref": "#/components/parameters/TraceIdHeader" }
        ],
        "responses": {
          "200": {
            "description": "Knowledge base collection",
            "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/KnowledgeBaseListResponse" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" }
        }
      },
      "post": {
        "operationId": "createKnowledgeBase",
        "tags": ["Knowledge"],
        "summary": "Create a knowledge base without activating a version",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/TraceIdHeader" },
          { "$ref": "#/components/parameters/IdempotencyKeyHeader" }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/CreateKnowledgeBaseRequest" }
            }
          }
        },
        "responses": {
          "201": {
            "description": "Knowledge base created",
            "headers": {
              "X-Trace-Id": { "$ref": "#/components/headers/TraceId" },
              "Location": { "$ref": "#/components/headers/Location" }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/KnowledgeBaseResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/knowledge-bases/{knowledgeBaseId}/versions": {
      "get": {
        "operationId": "listKnowledgeVersions",
        "tags": ["Knowledge"],
        "summary": "List immutable knowledge versions",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/KnowledgeBaseIdPath" },
          { "$ref": "#/components/parameters/TraceIdHeader" }
        ],
        "responses": {
          "200": {
            "description": "Knowledge version collection",
            "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/KnowledgeVersionListResponse" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      },
      "post": {
        "operationId": "startKnowledgeBuild",
        "tags": ["Knowledge"],
        "summary": "Create an inactive knowledge version and start its build",
        "description": "Build success never activates the version automatically.",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/KnowledgeBaseIdPath" },
          { "$ref": "#/components/parameters/TraceIdHeader" },
          { "$ref": "#/components/parameters/IdempotencyKeyHeader" }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": { "$ref": "#/components/schemas/StartKnowledgeBuildRequest" }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Knowledge build accepted",
            "headers": {
              "X-Trace-Id": { "$ref": "#/components/headers/TraceId" },
              "Location": { "$ref": "#/components/headers/Location" },
              "Retry-After": { "$ref": "#/components/headers/RetryAfter" }
            },
            "content": {
              "application/json": {
                "schema": { "$ref": "#/components/schemas/KnowledgeBuildAcceptedResponse" }
              }
            }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/projects/{projectId}": {
      "get": {
        "operationId": "getProject",
        "tags": ["Projects"],
        "summary": "Get a project",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/ProjectIdPath" },
          { "$ref": "#/components/parameters/TraceIdHeader" }
        ],
        "responses": {
          "200": {
            "description": "Project",
            "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ProjectResponse" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/api/connectors/{connectorId}": {
      "get": {
        "operationId": "getConnector",
        "tags": ["Connectors"],
        "summary": "Get a connector and selected immutable version",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/ConnectorIdPath" },
          { "$ref": "#/components/parameters/TraceIdHeader" }
        ],
        "responses": {
          "200": {
            "description": "Connector",
            "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ConnectorResponse" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/api/connectors/{connectorId}/versions/{connectorVersionId}/activate": {
      "post": {
        "operationId": "activateConnectorVersion",
        "tags": ["Connectors"],
        "summary": "Approve and activate an immutable connector version",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/ConnectorIdPath" },
          { "$ref": "#/components/parameters/ConnectorVersionIdPath" },
          { "$ref": "#/components/parameters/TraceIdHeader" },
          { "$ref": "#/components/parameters/IdempotencyKeyHeader" }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/StateMutationRequest" } } }
        },
        "responses": {
          "200": {
            "description": "Active connector version",
            "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/ConnectorResponse" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/knowledge-bases/{knowledgeBaseId}": {
      "get": {
        "operationId": "getKnowledgeBase",
        "tags": ["Knowledge"],
        "summary": "Get a knowledge base and active pointer",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/KnowledgeBaseIdPath" },
          { "$ref": "#/components/parameters/TraceIdHeader" }
        ],
        "responses": {
          "200": {
            "description": "Knowledge base",
            "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/KnowledgeBaseResponse" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/api/knowledge-versions/{knowledgeVersionId}": {
      "get": {
        "operationId": "getKnowledgeVersion",
        "tags": ["Knowledge"],
        "summary": "Get immutable knowledge version state",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/KnowledgeVersionIdPath" },
          { "$ref": "#/components/parameters/TraceIdHeader" }
        ],
        "responses": {
          "200": {
            "description": "Knowledge version",
            "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/KnowledgeVersionResponse" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" }
        }
      }
    },
    "/api/knowledge-versions/{knowledgeVersionId}/activate": {
      "post": {
        "operationId": "activateKnowledgeVersion",
        "tags": ["Knowledge"],
        "summary": "Approve and activate a built knowledge version",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/KnowledgeVersionIdPath" },
          { "$ref": "#/components/parameters/TraceIdHeader" },
          { "$ref": "#/components/parameters/IdempotencyKeyHeader" }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/StateMutationRequest" } } }
        },
        "responses": {
          "200": {
            "description": "Active knowledge version",
            "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/KnowledgeVersionResponse" } } }
          },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" },
          "403": { "$ref": "#/components/responses/Forbidden" },
          "404": { "$ref": "#/components/responses/NotFound" },
          "409": { "$ref": "#/components/responses/Conflict" }
        }
      }
    },
    "/api/knowledge-bases/{knowledgeBaseId}/rollback": {
      "post": {
        "operationId": "rollbackKnowledgeVersion",
        "tags": ["Knowledge"],
        "summary": "Roll back the active pointer to a previously active version",
        "security": [{ "bearerAuth": [] }],
        "parameters": [
          { "$ref": "#/components/parameters/KnowledgeBaseIdPath" },
          { "$ref": "#/components/parameters/TraceIdHeader" },
          { "$ref": "#/components/parameters/IdempotencyKeyHeader" }
        ],
        "requestBody": {
          "required": true,
          "content": { "application/json": { "schema": { "$ref": "#/components/schemas/RollbackKnowledgeRequest" } } }
        },
        "responses": {
          "200": {
            "description": "Restored knowledge version",
            "headers": { "X-Trace-Id": { "$ref": "#/components/headers/TraceId" } },
            "content": { "application/json": { "schema": { "$ref": "#/components/schemas/KnowledgeVersionResponse" } } }
          },
