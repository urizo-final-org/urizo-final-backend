name: axms-spring-dev

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  database:
    image: axms/core-postgres:pg16-vector0.8.5-trusted-dev
    build:
      context: ${AXMS_BACKEND_SOURCE_ROOT:-.}
      dockerfile: src/main/docker/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ax_module_studio
      POSTGRES_USER: bootstrap_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
    volumes:
      - axms_spring_core_db:/var/lib/postgresql/data
      - ${AXMS_BACKEND_SOURCE_ROOT:-.}/src/main/docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - ${AXMS_BACKEND_SOURCE_ROOT:-.}/src/main/docker/postgres/sync-runtime-roles.sh:/opt/axms/sync-runtime-roles.sh:ro
    secrets:
      - postgres_superuser_password
      - migration_owner_password
      - cms_app_password
      - dbeaver_reader_password
      - ai_workspace_password
      - dev_operator_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bootstrap_admin -d ax_module_studio"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    shm_size: 128m
    mem_limit: 1536m
    cpus: 1.50
    pids_limit: 256
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - axms_internal

  database_gateway:
    image: pgvector/pgvector:0.8.5-pg16-bookworm@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    restart: unless-stopped
    entrypoint: ["perl"]
    command: ["/opt/axms/tcp-relay.pl"]
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:15432"
    volumes:
      - ${AXMS_BACKEND_SOURCE_ROOT:-.}/src/main/docker/postgres/tcp-relay.pl:/opt/axms/tcp-relay.pl:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 15432 -d ax_module_studio"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    stop_grace_period: 10s
    logging: *default-logging
    networks:
      - axms_internal
      - axms_loopback

  flyway-migration:
    profiles: ["spring-core", "coding-agent", "full"]
    image: axms/spring-migration:dev
    build:
      context: ${AXMS_BACKEND_SOURCE_ROOT:-.}
      dockerfile: Dockerfile
      target: migration
    restart: "no"
    init: true
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - |
        password_file=/run/secrets/migration_owner_password
        test -s "$$password_file"
        export AXMS_DB_URL=jdbc:postgresql://database:5432/ax_module_studio
        export AXMS_MIGRATION_PASSWORD="$$(< "$$password_file")"
        export MAVEN_OPTS="-Djansi.force=false -Djansi.tmpdir=/workspace/target"
        mvn -o -B -ntp -Dstyle.color=never -Dflyway.validateMigrationNaming=true \
          flyway:migrate flyway:validate flyway:info
        status=$$?
        unset MAVEN_OPTS
        unset AXMS_MIGRATION_PASSWORD
        exit $$status
    depends_on:
      database:
        condition: service_healthy
    secrets:
      - migration_owner_password
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 1024m
    cpus: 1.50
    pids_limit: 256
    logging: *default-logging
    networks:
      - axms_internal

  valkey:
    profiles: ["spring-core", "coding-agent", "full"]
    image: valkey/valkey:8.1.3-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --aclfile
      - /run/secrets/valkey_acl
    volumes:
      - axms_spring_valkey:/data
    secrets:
      - valkey_password
      - valkey_acl
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/valkey_password)\" valkey-cli --no-auth-warning ping | grep -qx PONG"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128
    stop_grace_period: 20s
    logging: *default-logging
    networks:
      - axms_internal

  checkpoint_database:
    profiles: ["coding-agent", "full"]
    image: pgvector/pgvector:0.8.5-pg16-bookworm@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    restart: unless-stopped
    environment:
      POSTGRES_DB: axms_langgraph
      POSTGRES_USER: axms_checkpoint
      POSTGRES_PASSWORD_FILE: /run/secrets/checkpoint_postgres_password
    volumes:
      - axms_spring_checkpoint_db:/var/lib/postgresql/data
    secrets:
      - checkpoint_postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axms_checkpoint -d axms_langgraph"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s
    shm_size: 64m
    mem_limit: 768m
    cpus: 1.00
    pids_limit: 256
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - axms_internal

  spring-app:
    profiles: ["spring-core", "coding-agent", "full"]
    image: axms/spring-backend:dev
    build:
      context: ${AXMS_BACKEND_SOURCE_ROOT:-.}
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: ${AXMS_SPRING_PROFILES_ACTIVE:-dev,local-full,coding-job-local-fixture}
      JAVA_TOOL_OPTIONS: -XX:InitialRAMPercentage=20 -XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError
      AXMS_CORE_DB_JDBC_URL: jdbc:postgresql://database:5432/ax_module_studio
      AXMS_CORE_DB_USERNAME: cms_app
      AXMS_CORE_DB_PASSWORD_FILE: /run/secrets/cms_app_password
      AXMS_CMS_DB_URL: jdbc:postgresql://database:5432/ax_module_studio
      AXMS_CMS_DB_PASSWORD_FILE: /run/secrets/cms_app_password
      AXMS_CMS_MASTER_KEY_FILE: /run/secrets/cms_master_key
      AXMS_CMS_TRUSTED_PROXY_HOST: nginx
      # Shared demo administrators for the internal-network admin page. These are
      # deliberately in plain sight so every teammate can sign in without a secret
      # handoff; they are not deployment credentials and must be replaced before
      # this stack is exposed beyond the internal network.
      AXMS_AUTH_SUPER_ADMIN_LOGIN_ID: super-admin
      AXMS_AUTH_SUPER_ADMIN_PASSWORD: axms-super-admin-demo
      AXMS_AUTH_GENERAL_ADMIN_LOGIN_ID: general-admin
      AXMS_AUTH_GENERAL_ADMIN_PASSWORD: axms-general-admin-demo
      AXMS_AUTH_GENERAL_USER_LOGIN_ID: general-user
      AXMS_AUTH_GENERAL_USER_PASSWORD: axms-general-user-demo
      AXMS_AUTH_JWT_SIGNING_KEY_FILE: /run/secrets/auth_jwt_signing_key
      AXMS_CODING_JOB_LIFECYCLE_ENABLED: "true"
      AXMS_CODING_JOB_DB_URL: jdbc:postgresql://database:5432/ax_module_studio
      AXMS_CODING_JOB_DB_PASSWORD_FILE: /run/secrets/dev_operator_password
      AXMS_CODING_MODEL_TURN_BRIDGE_ENABLED: "true"
      AXMS_CODING_DB_URL: jdbc:postgresql://database:5432/ax_module_studio
      AXMS_CODING_DB_PASSWORD_FILE: /run/secrets/ai_workspace_password
      AXMS_VALKEY_HOST: valkey
      AXMS_VALKEY_PORT: "6379"
      AXMS_VALKEY_DATABASE: "0"
      AXMS_VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      AXMS_PRODUCT_QUEUE: axms:product:jobs:v1
      AXMS_CODING_QUEUE: axms:coding:jobs:v1
      AXMS_OUTBOX_LEASE: 15s
      AXMS_OUTBOX_POLL: 250ms
      AXMS_WORKER_POLL: 300ms
      AXMS_PRODUCT_WORKER_ID: axms-spring-app-local-1
      AXMS_MCP_PLATFORM_ENABLED: "true"
      AXMS_MCP_PLATFORM_ENDPOINT: http://mcp-server:8091/mcp
      AXMS_MCP_PLATFORM_CREDENTIAL_FILE: /run/secrets/mcp_service_token
    depends_on:
      database:
        condition: service_healthy
      valkey:
        condition: service_healthy
      flyway-migration:
        condition: service_completed_successfully
    secrets:
      - cms_app_password
      - cms_master_key
      - dev_operator_password
      - ai_workspace_password
      - valkey_password
      - auth_jwt_signing_key
      - mcp_service_token
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec \"exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /api/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '\""]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 1536m
    cpus: 2.00
    pids_limit: 512
    stop_grace_period: 40s
    logging: *default-logging
    networks:
      - axms_internal
      - axms_frontend
      - axms_egress
      - axms_mcp

  mcp-server:
    profiles: ["coding-agent", "full"]
    image: axms/mcp-server:dev
    build:
      context: ${AXMS_MCP_SOURCE_ROOT:-../urizo-final-mcp-server}
      dockerfile: Dockerfile
      args:
        UV_INSECURE_HOST: ${AXMS_UV_INSECURE_HOST:-}
    restart: unless-stopped
    init: true
    environment:
      AXMS_MCP_HOST: 0.0.0.0
      AXMS_MCP_PORT: "8091"
      AXMS_MCP_ALLOWED_HOSTS: mcp-server,mcp-server:*
      AXMS_MCP_SERVICE_TOKEN_FILE: /run/secrets/mcp_service_token
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    secrets:
      - mcp_service_token
    # The Coding workspaces must be a named volume, not a host bind mount.
    # A Docker Desktop bind mount always appears as root:root inside the
    # container, and the service runs as uid 10001, so Git refuses the
    # repository with "dubious ownership". That cannot be waived here: Git
    # reads safe.directory only from system/global config, and the server
    # pins GIT_CONFIG_GLOBAL to /dev/null with GIT_CONFIG_NOSYSTEM=1.
    volumes:
      - axms_mcp_workspaces:/workspaces
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "python", "-m", "axms_mcp_server.healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 384m
    cpus: 0.50
    pids_limit: 128
    stop_grace_period: 20s
    logging: *default-logging
    networks:
      - axms_mcp

  coding-runtime:
    profiles: ["coding-agent", "full"]
    image: axms/coding-runtime:dev
    build:
      context: ${AXMS_ORCHESTRATOR_SOURCE_ROOT:-../urizo-final-orchestrator}
      dockerfile: Dockerfile
      args:
        UV_INSECURE_HOST: ${AXMS_UV_INSECURE_HOST:-}
    restart: unless-stopped
    init: true
    environment:
      AXMS_SPRING_ORIGIN: http://spring-app:8080
      AXMS_SPRING_CREDENTIAL_FILE: /run/secrets/coding_model_bridge_service_token
      AXMS_CHECKPOINT_HOST: checkpoint_database
      AXMS_CHECKPOINT_PORT: "5432"
      AXMS_CHECKPOINT_DATABASE: axms_langgraph
      AXMS_CHECKPOINT_USER: axms_checkpoint
      AXMS_CHECKPOINT_PASSWORD_FILE: /run/secrets/checkpoint_postgres_password
      AXMS_CHECKPOINT_ENCRYPTION_KEY_FILE: /run/secrets/checkpoint_encryption_key
      AXMS_VALKEY_HOST: valkey
      AXMS_VALKEY_PORT: "6379"
      AXMS_VALKEY_DATABASE: "0"
      AXMS_VALKEY_PASSWORD_FILE: /run/secrets/valkey_password
      AXMS_HEALTH_HOST: 0.0.0.0
      AXMS_HEALTH_PORT: "8090"
      LANGGRAPH_STRICT_MSGPACK: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    depends_on:
      spring-app:
        condition: service_healthy
      checkpoint_database:
        condition: service_healthy
      valkey:
        condition: service_healthy
    secrets:
      - coding_model_bridge_service_token
      - checkpoint_postgres_password
      - checkpoint_encryption_key
      - valkey_password
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=2); raise SystemExit(0 if r.status == 200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 768m
    cpus: 1.00
    pids_limit: 256
    stop_grace_period: 30s
    logging: *default-logging
    networks:
      - axms_internal

  frontend:
    profiles: ["spring-core", "full"]
    image: axms/react-frontend:dev
    build:
      context: ${AXMS_FRONTEND_SOURCE_ROOT:-../urizo-final-frontend}
      dockerfile: Dockerfile
      args:
        AXMS_NODE_TLS_REJECT_UNAUTHORIZED: ${AXMS_NODE_TLS_REJECT_UNAUTHORIZED:-1}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=384
      VITE_DEV_PROXY_TARGET: http://spring-app:8080
    depends_on:
      spring-app:
        condition: service_healthy
    expose:
      - "5173"
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const response = await fetch('http://127.0.0.1:5173/'); process.exit(response.status === 200 ? 0 : 1)"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/node_modules/.vite:size=128m,mode=1777
      - /app/node_modules/.vite-temp:size=32m,mode=1777
    mem_limit: 512m
    cpus: 0.75
    pids_limit: 256
    stop_grace_period: 20s
    logging: *default-logging
    networks:
      - axms_frontend

  nginx:
    profiles: ["spring-core", "full"]
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    entrypoint: ["nginx", "-g", "daemon off;"]
    depends_on:
      spring-app:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AXMS_HTTP_PORT:-18080}:80"
    volumes:
      - ${AXMS_BACKEND_SOURCE_ROOT:-.}/src/main/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/nginx-health | grep -qx ok"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 5s
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=8m,mode=0755
      - /tmp:size=16m,mode=1777
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    stop_grace_period: 20s
    logging: *default-logging
    networks:
      - axms_frontend
      - axms_loopback

  coding_credential_registrar:
    profiles: ["ops"]
    image: pgvector/pgvector:0.8.5-pg16-bookworm@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    restart: "no"
    entrypoint: ["bash", "/opt/axms/register-coding-service-credential.sh"]
    depends_on:
      database:
        condition: service_healthy
    secrets:
      - coding_model_bridge_service_token
      - dev_operator_password
    volumes:
      - ${AXMS_BACKEND_SOURCE_ROOT:-.}/src/main/docker/postgres/register-coding-service-credential.sh:/opt/axms/register-coding-service-credential.sh:ro
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    logging: *default-logging
    networks:
      - axms_internal

secrets:
  postgres_superuser_password:
    file: ./.local/secrets/postgres_superuser_password
  migration_owner_password:
    file: ./.local/secrets/migration_owner_password
  cms_app_password:
    file: ./.local/secrets/cms_app_password
  cms_master_key:
    file: ./.local/secrets/cms_master_key
  dbeaver_reader_password:
    file: ./.local/secrets/dbeaver_reader_password
  ai_workspace_password:
    file: ./.local/secrets/ai_workspace_password
  dev_operator_password:
    file: ./.local/secrets/dev_operator_password
  coding_model_bridge_service_token:
    file: ./.local/secrets/coding_model_bridge_service_token
  mcp_service_token:
    file: ./.local/secrets/mcp_service_token
  checkpoint_postgres_password:
    file: ./.local/secrets/checkpoint_postgres_password
  checkpoint_encryption_key:
    file: ./.local/secrets/checkpoint_encryption_key
  valkey_password:
    file: ./.local/secrets/valkey_password
  valkey_acl:
    file: ./.local/secrets/valkey_acl
  auth_jwt_signing_key:
    file: ./.local/secrets/auth_jwt_signing_key

volumes:
  axms_spring_core_db:
    name: axms-spring-dev-core-db
  axms_spring_checkpoint_db:
    name: axms-spring-dev-checkpoint-db
  axms_spring_valkey:
    name: axms-spring-dev-valkey
  axms_mcp_workspaces:
    name: axms-spring-dev-mcp-workspaces

networks:
  axms_internal:
    name: axms-spring-dev-internal
    internal: true
  axms_loopback:
    name: axms-spring-dev-loopback
  axms_frontend:
    name: axms-spring-dev-frontend
    internal: true
  axms_egress:
    name: axms-spring-dev-egress
  axms_mcp:
    name: axms-spring-dev-mcp
    internal: true
