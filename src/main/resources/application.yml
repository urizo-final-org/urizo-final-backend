spring:
  application:
    name: ax-module-studio-backend
  ai:
    mcp:
      client:
        enabled: false
        toolcallback:
          enabled: false
  main:
    banner-mode: "off"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  flyway:
    enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  # 컨텐츠 본문 이미지 업로드. 기본값이 파일 1MB라 폰 사진이 앞단에서 막힌다.
  # nginx client_max_body_size와 CmsService.MAX_IMAGE_BYTES도 같은 8MB에 맞춘다.
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 0.0

ax:
  ai:
    provider-lane: ${AX_AI_PROVIDER_LANE:PRODUCT}
    mcp-platform:
      enabled: ${AXMS_MCP_PLATFORM_ENABLED:false}
      endpoint: ${AXMS_MCP_PLATFORM_ENDPOINT:http://127.0.0.1:8091/mcp}
      credential-file: ${AXMS_MCP_PLATFORM_CREDENTIAL_FILE:.local/secrets/mcp_service_token}
      connect-timeout: ${AXMS_MCP_PLATFORM_CONNECT_TIMEOUT:3s}
      request-timeout: ${AXMS_MCP_PLATFORM_REQUEST_TIMEOUT:5s}
      max-response-bytes: ${AXMS_MCP_PLATFORM_MAX_RESPONSE_BYTES:65536}
    langfuse:
      base-url: ${LANGFUSE_BASE_URL:}
      public-key: ${LANGFUSE_PUBLIC_KEY:}
      secret-key: ${LANGFUSE_SECRET_KEY:}
      connect-timeout: 3s
      request-timeout: 5s
      cache-ttl: 30s
      max-response-bytes: 262144
  coding:
    job-lifecycle:
      enabled: false
    model-turn-bridge:
      enabled: false
      # Recent read_file/search_code results the code stage keeps verbatim; older ones
      # fold to a note. 0 disables folding.
      tool-history-keep: 3
